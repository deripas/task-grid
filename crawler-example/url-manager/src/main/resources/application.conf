# Pekko of the cluster mode of url-manager (url-manager.queue: cluster). Addresses, seed nodes and contact points come
# from url-manager.cluster.* (application.yaml); here - what does not depend on the deployment.
pekko {
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  loglevel = INFO

  actor.provider = cluster

  remote.artery {
    bind.hostname = 0.0.0.0
    # an inline result of an attempt (up to INLINE_MAX of the sidecar, 512KiB) and a task with its payload travel
    # between nodes; the default frame is 256KiB
    advanced.maximum-frame-size = 1MiB
  }

  cluster {
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    split-brain-resolver.active-strategy = keep-majority
    # a node that cannot join leaves the process to its supervisor (k8s, compose) instead of hanging
    shutdown-after-unsuccessful-join-seed-nodes = 60s
  }
  coordinated-shutdown.exit-jvm = off

  persistence {
    journal.plugin = "pekko.persistence.cassandra.journal"
    snapshot-store.plugin = "pekko.persistence.cassandra.snapshot"
    cassandra {
      # the schema is applied beforehand (cql/schema.cql): autocreate races with the first recoveries
      journal.keyspace = "url_manager"
      snapshot.keyspace = "url_manager_snapshot"
      # no persistence query here: no tag tables, no events-by-tag
      events-by-tag.enabled = false
    }
  }
}

datastax-java-driver {
  advanced.reconnect-on-init = true
}
