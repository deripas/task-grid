spring:
  application:
    name: url-manager
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  rabbitmq:
    # replies are confirmed before a request is acknowledged
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: manual
        # requests in work at once per instance, including those waiting for the crawl-delay of their host
        prefetch: 1000

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # prometheus: load of the worker pools by kind for autoscaling (task_grid_worker_*)
        include: health,prometheus

url-manager:
  grpc-port: 9090
  # sidecars ping every 10s (NODE_KEEPALIVE_TIME): permit-time must not be above it
  grpc-keepalive:
    time: 30s
    timeout: 10s
    permit-time: 5s
  default-timeout: 60s
  max-timeout: 10m
  max-attempts: 3
  crawl-delay: 1s
  result-ttl: 1m
  shutdown-timeout: 5s
  blob:
    endpoint: ${BLOB_S3_ENDPOINT:}
    region: ${BLOB_S3_REGION:us-east-1}
    access-key: ${BLOB_S3_ACCESS_KEY:}
    secret-key: ${BLOB_S3_SECRET_KEY:}
  rabbit:
    enabled: false
    queue: url-manager.fetch
    ack: after-reply
