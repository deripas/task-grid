spring:
  application:
    name: url-manager
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  rabbitmq:
    # replies are confirmed before a request is acknowledged
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: manual
        # requests in work at once per instance, including those waiting for the crawl-delay of their host
        prefetch: 1000

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # prometheus: load of the worker pools by kind for autoscaling (task_grid_worker_*)
        include: health,prometheus

url-manager:
  # memory - tasks in this process; cluster - in the Pekko cluster of url-managers, journal in ScyllaDB
  queue: memory
  cluster:
    host: ${PEKKO_HOST:127.0.0.1}
    port: ${PEKKO_PORT:25520}
    # host:port of the nodes to join through, comma separated; empty - this node alone
    seed-nodes: ${PEKKO_SEED_NODES:}
    contact-points: ${SCYLLA_CONTACT_POINTS:127.0.0.1:9042}
    datacenter: ${SCYLLA_DATACENTER:datacenter1}
  grpc-port: 9090
  # sidecars ping every 10s (NODE_KEEPALIVE_TIME): permit-time must not be above it
  # the node pings as often: a sidecar gone without closing its connection is found in ~15s
  grpc-keepalive:
    time: 10s
    timeout: 5s
    permit-time: 5s
  default-timeout: 60s
  max-timeout: 10m
  max-attempts: 3
  # a hung or lost attempt is retried after this; above max-timeout
  attempt-timeout: 15m
  crawl-delay: 1s
  result-ttl: 1m
  shutdown-timeout: 5s
  blob:
    endpoint: ${BLOB_S3_ENDPOINT:}
    region: ${BLOB_S3_REGION:us-east-1}
    access-key: ${BLOB_S3_ACCESS_KEY:}
    secret-key: ${BLOB_S3_SECRET_KEY:}
  rabbit:
    enabled: false
    queue: url-manager.fetch
    ack: after-reply
