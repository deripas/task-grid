# task-grid-queue-pekko: defaults of the library. The cluster, journal and snapshot plugins are configured by the
# application.
task-grid.queue.pekko {
  # submit waits this long for the partition to persist the task
  ask-timeout = 10s
  # a final result is delivered before the end of its task is persisted; a delivery not done in this time failed
  delivery-timeout = 10s
  # a failed delivery of the result of a deadline (attempts exhausted by time) is decided again after this; a result
  # of a worker is repeated by the worker
  redeliver-after = 5s
  # events of a partition between snapshots; older events are deleted
  snapshot-every = 100
  # an empty partition stays in memory this long before it stops: a task of its key coming within it is handled
  # without recovery from the journal, with the rest of the pause known. Keep it above the usual pause (crawl-delay):
  # a matter of cost only, a partition never stops before its pause ends
  idle-timeout = 2m
}

pekko.actor.serialization-bindings {
  "io.github.deripas.taskgrid.queue.pekko.PartitionEntity$Command" = jackson-cbor
  "io.github.deripas.taskgrid.queue.pekko.PartitionEntity$Rested" = jackson-cbor
  "io.github.deripas.taskgrid.queue.partition.PartitionEvent" = jackson-cbor
  "io.github.deripas.taskgrid.queue.partition.PartitionSnapshot" = jackson-cbor
}
