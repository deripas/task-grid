// handler-sidecar <-> task-grid node.
//
// The sidecar runs next to a handler and connects to the node; the node sends it attempts of the handler's kind.
// Payloads and results are bytes: their types are known only to whoever submits the task and to the handler.
//
// Slots belong to the sidecar (credits). The node sends attempts only while it holds credit of the session:
// - the node tells its demand - how many attempts it would like to send to this sidecar (Demand);
// - the sidecar grants slots as credit (Credit); unused credit plus attempts in progress never exceed its capacity.
// Credit and demand are absolute values (limit / target with a version), not increments: a lost or repeated
// message breaks nothing, and the node returns surplus credit with the same Demand.
//
// A session is one Connect stream. A sidecar keeps a session with each node (DNS name -> every address) and splits
// its slots among them. Attempts in progress belong to the sidecar process (worker_id + instance_id), not to
// the session: the result of an attempt may come through any session, and through any node - meta finds the queue
// partition of the task.
// - A new session of the same worker_id supersedes the previous one as the channel (its stream is closed with OK);
//   with the same instance_id the attempts in progress stay, with another one (the process was restarted and has
//   lost them) the node gives them to other sidecars at once.
// - A session breaks (cancellation, error): its attempts wait for the sidecar to reconnect for a while (rejoin
//   timeout of the node), then go to other sidecars with the same attempt number.
//
// Shutdown of the sidecar (drain): stop granting credit and half-close the streams. The node sends no more attempts,
// waits for the results of the attempts in progress (Complete) and then closes the stream with OK; a draining sidecar
// that breaks the stream is not waited for.
syntax = "proto3";

package taskgrid.worker.remote.v1;

option java_multiple_files = true;
option java_package = "io.github.deripas.taskgrid.worker.remote.v1";
option go_package = "github.com/deripas/task-grid/handler-sidecar/internal/gen/remote/v1;remotev1";

service Node {
  // Session of a sidecar with the node. The first message of the sidecar is Hello, then Credit as slots free up and
  // Share when the number of its sessions changes; the half-close of the sidecar is drain. The node sends attempts within the credit and its demand when it changes.
  rpc Connect(stream SidecarMessage) returns (stream NodeMessage);

  // Result of an attempt. OK - the result is taken (at-least-once): until OK the sidecar keeps the result
  // and repeats the call; a repeated call is harmless.
  rpc Complete(CompleteRequest) returns (CompleteResponse);
}

message SidecarMessage {
  oneof msg {
    Hello hello = 1;
    Credit credit = 2;
    Share share = 3;
  }
}

// Opens the session.
message Hello {
  string worker_id = 1;     // stable name of the sidecar instance (pod name); marks its results
  string kind = 2;          // kind of tasks the handler executes
  int32 capacity = 3;       // attempts the handler runs at once: upper bound of the demand
  string instance_id = 4;   // random value of the process, new on each start
}

// The node may send attempts with numbers up to limit (numbered from 1 in each session).
message Credit {
  int64 limit = 1;
  int64 version = 2;        // grows with each Credit of the session
}

// Share of the capacity the node counts in its load (pool metrics): capacity / number of sessions of the sidecar,
// so that the sum over the nodes is the capacity of the pool. Until the first Share - the whole capacity.
message Share {
  double capacity = 1;
}

message NodeMessage {
  oneof msg {
    Attempt attempt = 1;
    Demand demand = 2;
  }
}

// Demand of the node for this sidecar; sent when it changes.
message Demand {
  // Absolute number of the session attempt the node would like credit up to: attempts already sent plus
  // attempts waiting for this sidecar. Sending an attempt does not change it.
  int64 target = 1;
  // Version of the last Credit received. target below limit returns surplus credit: the sidecar lowers
  // its limit to target only if version is still its current one (otherwise new credit is on its way).
  int64 version = 2;
}

message Attempt {
  string task_id = 1;
  int32 number = 2;                 // attempt number of the task, from 1
  map<string, string> meta = 3;     // whole task meta: kind, affinity key, keys of the application
  bytes payload = 4;                // input of the handler as is
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  DONE = 1;                 // there is a result; domain errors (HTTP 404) are DONE too, they are content
  FAILED = 2;               // final, no retry
  RETRY = 3;                // technical failure: the attempt counts, the task is retried
}

message CompleteRequest {
  string worker_id = 1;
  string task_id = 2;
  int32 attempt = 3;        // Attempt.number
  Status status = 4;
  // DONE: output of the handler - inline, or, above the inline limit of the sidecar, a reference to the object
  // the sidecar has put into blob storage
  oneof result {
    bytes body = 5;
    BlobRef blob = 7;
  }
  string error = 6;         // not DONE: description of the failure
  // Attempt.meta as received: the node finds the queue partition of the task by it, also after the task has
  // moved to another node
  map<string, string> meta = 8;
}

// Output of the handler in blob storage. Deleting it is the job of the storage (TTL of the key prefix).
message BlobRef {
  string location = 1;      // address of the object, s3://<bucket>/<key>
  int64 size = 2;           // bytes of the output, before encoding
  string sha256 = 3;        // of the output before encoding, lowercase hex
  string encoding = 4;      // of the stored object: "zstd"; empty - stored as is
}

message CompleteResponse {}
