# task-grid-mailbox-pekko: defaults of the library. The cluster, journal and snapshot plugins are configured by the
# application; the limit and the ttl of the boxes - MailboxSettings.
task-grid.mailbox.pekko {
  # a command waits this long for the box
  ask-timeout = 10s
  # a subscriber checks this often that its box still knows it (the box moved to another node, restarted)
  heartbeat = 5s
  # events of a box between snapshots; older events are deleted
  snapshot-every = 100
  # an empty box without a subscription stays in memory this long before it stops
  idle-timeout = 1m
}

pekko.actor.serialization-bindings {
  "io.github.deripas.taskgrid.mailbox.pekko.BoxEntity$Command" = jackson-cbor
  "io.github.deripas.taskgrid.mailbox.pekko.BoxEntity$Event" = jackson-cbor
  "io.github.deripas.taskgrid.mailbox.pekko.BoxEntity$Snapshot" = jackson-cbor
  "io.github.deripas.taskgrid.mailbox.pekko.BoxSubscriber$Message" = jackson-cbor
}
